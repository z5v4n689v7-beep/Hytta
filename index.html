<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20372f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Hyttan</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--forest:#20372f;--pine:#315344;--cream:#f5f1e7;--snow:#fbfcf8;--wood:#b78a5a;--ink:#24302b;--muted:#6e7771;--line:#e3e3da}
*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(#e8eee9,var(--cream) 34rem);color:var(--ink);min-height:100vh}
.hero{height:270px;background-image:linear-gradient(to bottom,rgba(17,35,29,.08),rgba(17,35,29,.62)),url("hero.jpg");background-size:cover;background-position:center 55%;position:relative;display:flex;align-items:flex-end;padding:25px 18px}.hero-inner{width:min(720px,100%);margin:0 auto;color:white;text-shadow:0 2px 12px #0008}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;font-weight:700;opacity:.9}.hero h1{font-family:Georgia,serif;font-size:42px;line-height:1;margin:5px 0}.hero p{margin:0;font-size:15px;opacity:.94}
.shell{max-width:720px;margin:-1px auto 0;padding:0 12px 36px}.tabs{display:flex;gap:7px;position:sticky;top:0;z-index:5;padding:10px 0;background:rgba(245,241,231,.95);backdrop-filter:blur(8px)}.tabs button{flex:1;border:0;border-radius:14px;padding:12px 4px;background:#e4e5dc;color:#405048;font-weight:750;font-size:14px;box-shadow:inset 0 0 0 1px #d7d9d0}.tabs button.active{background:var(--forest);color:#fff;box-shadow:0 4px 10px #20372f25}.page{display:none}.page.active{display:block}.card{background:var(--snow);border-radius:18px;margin:10px 0 14px;padding:8px 15px 7px;box-shadow:0 6px 24px #263a3012;border:1px solid #e8e5dc}.card h2{font-family:Georgia,serif;font-size:21px;margin:10px 1px 7px;color:var(--forest)}.card h2:before{content:'◆';font-family:serif;color:var(--wood);font-size:10px;margin-right:8px;vertical-align:3px}.item{display:flex;align-items:flex-start;gap:12px;padding:13px 1px;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}.item input{appearance:none;-webkit-appearance:none;width:23px;height:23px;min-width:23px;border:2px solid #9ba9a1;border-radius:7px;margin:0;position:relative;background:white}.item input:checked{background:var(--pine);border-color:var(--pine)}.item input:checked:after{content:'✓';position:absolute;color:#fff;font-size:17px;font-weight:800;left:3px;top:-1px}.item label{line-height:1.35;flex:1;font-size:15.5px}.item input:checked+label{color:#8a918d;text-decoration:line-through}.note{font-size:12.5px;color:var(--muted);margin-top:4px;text-decoration:none}.reset{border:0;background:transparent;color:#67766e;padding:9px 4px 15px;font-weight:650;font-size:13px}.footer{text-align:center;color:#78817c;font-size:12px;padding:10px 0 0}.footer span{color:var(--wood)}
@media(max-width:480px){.hero{height:230px}.hero h1{font-size:37px}.shell{padding-left:10px;padding-right:10px}.tabs button{font-size:13px}.card{border-radius:16px}}
</style></head><body><header class="hero"><div class="hero-inner"><div class="eyebrow">Vår fjällstuga</div><h1>Hyttan</h1><p>Ankomst, avfärd och underhåll</p></div></header><div class="shell"><nav class="tabs" aria-label="Checklistor"><button data-p="ankomst">🏔️ Ankomst</button><button data-p="avfard">🏡 Avfärd</button><button data-p="underhall">🛠️ Underhåll</button></nav><main>
<section id="ankomst" class="page"><div class="card"><h2>Ankomst</h2><div class="item"><input type="checkbox" id="a1"><label for="a1">Sätt på vattnet</label></div><div class="item"><input type="checkbox" id="a2"><label for="a2">Höj termostater och värmepump</label></div></div><button class="reset" data-reset="ankomst">Nollställ lista</button></section>
<section id="avfard" class="page"><div class="card"><h2>Avfärd</h2><div class="item"><input type="checkbox" id="d1"><label for="d1">Töm kaffemaskinen på sump och vatten</label></div><div class="item"><input type="checkbox" id="d2"><label for="d2">Töm dammsugaren på rent och smutsigt vatten</label></div><div class="item"><input type="checkbox" id="d3"><label for="d3">Öppna alla sovrumsdörrar</label></div><div class="item"><input type="checkbox" id="d4"><label for="d4">Stäng alla badrumsdörrar</label></div><div class="item"><input type="checkbox" id="d5"><label for="d5">Öppna dörren till tvättstugan</label></div><div class="item"><input type="checkbox" id="d6"><label for="d6">Öppna dörren på loftet</label></div><div class="item"><input type="checkbox" id="d7"><label for="d7">Stäng alla fönster</label></div><div class="item"><input type="checkbox" id="d8"><label for="d8">Öppna en ventil i vardagsrum, kök och ett sovrum</label></div><div class="item"><input type="checkbox" id="d9"><label for="d9">Lås altandörren</label></div><div class="item"><input type="checkbox" id="d10"><label for="d10">Lås boden</label></div><div class="item"><input type="checkbox" id="d11"><label for="d11">Stäng av vattnet</label></div><div class="item"><input type="checkbox" id="d12"><label for="d12">Stäng av fasadbelysning</label></div><div class="item"><input type="checkbox" id="d13"><label for="d13">Sänk alla golvvärmetermostater till 15 grader</label></div><div class="item"><input type="checkbox" id="d14"><label for="d14">Sänk luftvärmepumpen till 17 grader, fläkt auto och mode värme</label></div></div><button class="reset" data-reset="avfard">Nollställ lista</button></section>
<section id="underhall" class="page"><div class="card"><h2>Snöslunga</h2><div class="item"><input type="checkbox" id="u1"><label for="u1">Byt olja efter 5 driftstimmar<div class="note">Engångsåtgärd</div></label></div><div class="item"><input type="checkbox" id="u2"><label for="u2">Smörj och byt tändstift vid behov<div class="note">1 gång per år</div></label></div><div class="item"><input type="checkbox" id="u3"><label for="u3">Inför vinterförvaring: fyll tanken till max eller töm den helt<div class="note">Inför vinterförvaring</div></label></div></div><div class="card"><h2>Utomhus</h2><div class="item"><input type="checkbox" id="u4"><label for="u4">Rengör stuprännor och rör från löv</label></div></div><button class="reset" data-reset="underhall">Nollställ lista</button></section>
</main><div class="footer"><span>◆</span> Hyttan <span>◆</span></div></div><script>var KEY='stugan-check-v3'; var s={}; try{s=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){s={}}; var inputs=document.querySelectorAll('input[type=checkbox]'); for(var i=0;i<inputs.length;i++){(function(x){x.checked=!!s[x.id];x.onchange=function(){s[x.id]=x.checked;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}})(inputs[i])} function show(id){var pages=document.querySelectorAll('.page');for(var i=0;i<pages.length;i++){pages[i].className=pages[i].id===id?'page active':'page'} var bs=document.querySelectorAll('.tabs button');for(var j=0;j<bs.length;j++){bs[j].className=bs[j].getAttribute('data-p')===id?'active':''} try{localStorage.setItem('stugan-tab',id)}catch(e){}} var tabs=document.querySelectorAll('.tabs button');for(var k=0;k<tabs.length;k++){tabs[k].onclick=function(){show(this.getAttribute('data-p'))}} var resets=document.querySelectorAll('.reset');for(var r=0;r<resets.length;r++){resets[r].onclick=function(){var list=document.querySelectorAll('#'+this.getAttribute('data-reset')+' input');for(var n=0;n<list.length;n++){list[n].checked=false;s[list[n].id]=false}try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}} var start='ankomst';try{start=localStorage.getItem('stugan-tab')||'ankomst'}catch(e){}show(start);if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}</script></body></html>
